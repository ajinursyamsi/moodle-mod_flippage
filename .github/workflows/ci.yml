name: Moodle Plugin CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pgsql, zip, gd, intl, soap, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ../ci ^4
          echo "$(pwd)/../ci/bin" >> "$GITHUB_PATH"

      - name: Install Moodle
        run: moodle-plugin-ci install --db-type=pgsql --db-host=127.0.0.1 --db-user=moodle --db-pass=moodle --db-name=moodle_ci --moodle=MOODLE_405_STABLE --branch=main --repo=../moodle --data=../moodledata --no-init

      - name: PHP lint
        run: moodle-plugin-ci phplint

      - name: Validate plugin
        run: moodle-plugin-ci validate
